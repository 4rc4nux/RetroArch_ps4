
# Fixed copy of the upstream workflow, with a manual "Run workflow" button added.
# Paste this over the ENTIRE .github/workflows/PS4-ORBIS.yml in your fork.
# Only ONE "on:" block may exist - that is what makes the file invalid otherwise.
on:
  push:
    branches: [master]
    paths:
      - '**'
      - '!samples/**'
      - '!libretro-common/samples/**'
      - '!.github/workflows/*.yml'
      - '.github/workflows/PS4-ORBIS.yml'
  pull_request:
    paths:
      - '**'
      - '!samples/**'
      - '!libretro-common/samples/**'
      - '!.github/workflows/*.yml'
      - '.github/workflows/PS4-ORBIS.yml'
  repository_dispatch:
    types: [run_build]
  workflow_dispatch:
permissions:
  contents: read
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ORBIS_IMAGE: reallibretroretroarch/libretro-build-orbis:latest
    steps:
    - uses: actions/checkout@v4
    - name: Link with lld
      run: sh .github/workflows/scripts/use-lld.sh
    - name: Log in to Docker Hub
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      run: |
        if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
        fi
    - name: Compile RA
      run: |
        docker run --rm --user root -v "$PWD":/src -w /src "$ORBIS_IMAGE" bash -c '
          set -e
          apk add ncurses-dev make bash python2
          apk add libintl icu-dev wget
          wget https://dot.net/v1/dotnet-install.sh && chmod 755 dotnet-install.sh && ./dotnet-install.sh -c 3.0 --install-dir ~/cli
          export PATH=~/cli:$PATH
          make -f Makefile.orbis -j$(getconf _NPROCESSORS_ONLN) HAVE_STATIC_DUMMY=1 info all
          clang --version
          orbis-ld --version
        '
    - name: Get short SHA
      id: slug
      run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@v4
      with:
        name: bin-${{ steps.slug.outputs.sha8 }}
        path: |
          retroarch_orbis.elf
          retroarch_orbis.oelf
          retroarch_orbis.self
